# 異能コード v0.2.0 — GitHub Pages 初回導入と以降の自動公開
# GitHubのリポジトリで新規ファイル .github/workflows/install.yml を作り、この全文を貼り付けてください。
name: Install and publish Inou Code

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import the original game (first run only)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            curl --fail --location --silent --show-error --retry 3 \
              'https://c908e696-38f7-477e-9b88-0311fe38d51f.sandbox.floot.app/_cdn/static/inou-code-v020-stable.zip' \
              --output /tmp/inou-code.zip
            echo 'd72cef0ab7982b8d822ad201224b1b7a61e54174b3c29ac2a7d7d797ee93c5a3  /tmp/inou-code.zip' | sha256sum --check
            # ZIP内の古い公開設定は使わず、このワークフローを保存します。
            unzip -q -o /tmp/inou-code.zip -d . -x '.github/workflows/*'
            test -s package.json
            test -s package-lock.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --all
            if ! git diff --cached --quiet; then
              git commit -m 'Import Inou Code v0.2.0 game and artwork'
              git push origin HEAD:main
            fi
          else
            echo 'Game source already present; skip import.'
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build game
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
