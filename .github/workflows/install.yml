name: Install and publish Inou Code

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update game files
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '"version": "0.3.0"' package.json 2>/dev/null; then
            curl -fLsS --retry 3 'https://c908e696-38f7-477e-9b88-0311fe38d51f.sandbox.floot.app/_cdn/static/inou-code-ui-v0.3.0-final.zip' -o /tmp/game.zip
            echo '128da62dd2e531601b1bdc64b167f2afbcb1d5386e3f28e429176b6b3b8cbd6d  /tmp/game.zip' | sha256sum -c -
            unzip -q -o /tmp/game.zip -d . -x '.github/workflows/*'
            test -s package.json
            test -s package-lock.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m 'Update Inou Code to v0.3.0'
              git push origin HEAD:main
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build game
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
