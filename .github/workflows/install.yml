        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, base64, gzip
          patch = gzip.decompress(base64.b64decode(os.environ['INOU_PATCH']))
          exec(compile(patch, 'inou_battle_update_v050.py', 'exec'))
          PYTHON
          npm install --package-lock-only --no-audit --no-fund

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Verify TypeScript and build
        run: npm run build

      - name: Save source to GitHub
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/_index.tsx pages/_index.module.css package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Battle portrait and impact effects v0.5.0'
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
