name: Inou Code v0.5.1 One-Screen Battle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install one-screen battle layout
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'INOU v0.5.1 ONE-SCREEN COMBAT' pages/_index.module.css; then
            printf '%s' '' | base64 -d | gzip -d >> pages/_index.module.css
          fi
          npm pkg set version=0.5.1
          npm install --package-lock-only --no-audit --no-fund
      - name: Build and typecheck
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit game update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/_index.module.css package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'One-screen battle layout v0.5.1'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4
        id: deployment
