name: Inou Code v0.6.4 Full Body Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Download verified v0.6.4
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 120 'https://inou-code-release-storage-1ir5ld.v2.appdeploy.ai/install-v064.yml' -o /tmp/inou-v064.yml
          echo '1ff631569b215d6c8fe75bf2ca1301f4aff816727fa8a1164d676f18a64530e1  /tmp/inou-v064.yml' | sha256sum -c -
      - name: Install six canonical characters
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import os,subprocess,yaml
          from pathlib import Path
          release=yaml.safe_load(Path('/tmp/inou-v064.yml').read_text())
          installer=next(x for x in release['jobs']['deploy']['steps'] if x.get('name')=='Install canonical full-body illustrations')
          env=os.environ.copy()
          env.update(installer['env'])
          subprocess.run(['bash','-e','-o','pipefail','-c',installer['run']],env=env,check=True)
          PY
      - name: Build game
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Save update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/character-fullbody-v064.avif pages/_index.module.css package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Install canonical full-body characters v0.6.4'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4
