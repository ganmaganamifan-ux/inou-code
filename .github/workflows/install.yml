name: Install and publish Inou Code

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import game files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            curl -fLsS --retry 3 'https://c908e696-38f7-477e-9b88-0311fe38d51f.sandbox.floot.app/_cdn/static/inou-code-v020-stable.zip' -o /tmp/game.zip
            echo 'd72cef0ab7982b8d822ad201224b1b7a61e54174b3c29ac2a7d7d797ee93c5a3  /tmp/game.zip' | sha256sum -c -
            unzip -q -o /tmp/game.zip -d . -x '.github/workflows/*'
            test -s package.json
            test -s package-lock.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m 'Import Inou Code v0.2.0'
              git push origin HEAD:main
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build game
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
