name: Inou Code v0.6.1 HD Character Art
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Download checked character update
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            'https://inou-code-release-storage-1ir5ld.v2.appdeploy.ai/install-v061.yml' \
            -o /tmp/inou-v061.yml
          echo '6883fdde85d2c629ab5efb609b1139b152827c9461131c3ac5672574ca63b79a  /tmp/inou-v061.yml' | sha256sum -c -
      - name: Install transparent portraits
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          import yaml
          release=yaml.safe_load(Path('/tmp/inou-v061.yml').read_text())
          installer=release['jobs']['publish']['steps'][2]
          assert installer['name']=='Install transparent character portraits'
          env=os.environ.copy()
          env.update(installer['env'])
          subprocess.run(['bash','-e','-o','pipefail','-c',installer['run']],env=env,check=True)
          PY
      - name: Build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/character-portraits-v061.avif pages/_index.module.css pages/_index.tsx package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Layered HD character portraits v0.6.1'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4
