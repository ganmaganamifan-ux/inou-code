name: Inou Code v0.6.3 Visual Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Download and verify character update
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 120 \
            https://inou-code-release-storage-1ir5ld.v2.appdeploy.ai/v063-art-data.txt \
            -o /tmp/v063-art.txt
          curl -fLsS --retry 3 --max-time 120 \
            https://inou-code-release-storage-1ir5ld.v2.appdeploy.ai/v063-installer.txt \
            -o /tmp/v063-install.py
          echo '22ba598bc79e7f4457649e193da1f8624284eb7406c44d108e7a39f867eba7a2  /tmp/v063-art.txt' | sha256sum -c -
          echo 'ec156be3accf5b8bf982489cd34e430b926339f08932d66bac210e0a399c27e5  /tmp/v063-install.py' | sha256sum -c -
      - name: Fix original cast graphics
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/v063-install.py /tmp/v063-art.txt
          npm pkg set version=0.6.3
          npm install --package-lock-only --no-audit --no-fund
      - name: Build and check game
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit game update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/character-canon-v063.webp pages/_index.module.css package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Improve original cast visual quality v0.6.3'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4
        id: publish
