name: Inou Code v0.6.2 Canonical Cast
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fetch verified six-character update
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            'https://inou-code-release-storage-1ir5ld.v2.appdeploy.ai/install-v062.yml' \
            -o /tmp/inou-v062.yml
          echo '184d6a3cc76cb22f52d173a750c1a82b4535135411336bd372d65cc8cfffa846  /tmp/inou-v062.yml' | sha256sum -c -
      - name: Install original character cast
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          import yaml
          release = yaml.safe_load(Path('/tmp/inou-v062.yml').read_text(encoding='utf-8'))
          steps = release['jobs']['deploy']['steps']
          installer = next(s for s in steps if s.get('name') == 'Install original six characters')
          env = os.environ.copy()
          env.update(installer['env'])
          subprocess.run(['bash','-e','-o','pipefail','-c',installer['run']], env=env,check=True)
          PY
      - name: Build and check
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit game update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/character-canon-v062.avif pages/_index.module.css pages/_index.tsx helpers/GameData.tsx package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Restore original six character designs v0.6.2'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4
